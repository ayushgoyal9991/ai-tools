# Ollama connection
spring.ai.ollama.base-url=http://localhost:11434

# Chat model
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.3

# Embedding model
spring.ai.ollama.embedding.model=nomic-embed-text

# Server
server.port=8080

# RAG settings
rag.chunk-size=200
rag.chunk-overlap=20
rag.top-k=5
rag.score-threshold=0.1
rag.chunking-strategy=recursive
rag.query-rewriting.enabled=true

# Hybrid search weights (must add up to 1.0)
rag.vector.weight=0.7
rag.keyword.weight=0.3
rag.keyword.threshold=0.1

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Max file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=ayush
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session config
server.servlet.session.timeout=30m